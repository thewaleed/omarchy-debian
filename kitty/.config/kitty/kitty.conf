# Colors are generated from the current wallpaper by pywal16 (wal-sync).
# Source template: ~/.config/wal/templates/colors-kitty.conf
include ~/.cache/wal/colors-kitty.conf

# Font
font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
disable_ligatures cursor

# Window
window_padding_width   12
hide_window_decorations yes
confirm_os_window_close 0
background_opacity     0.94
dynamic_background_opacity yes
window_border_width    1pt
draw_minimal_borders   yes
inactive_text_alpha    0.85

# Cursor
cursor_shape              beam
cursor_beam_thickness     1.5
cursor_blink_interval     0.6
cursor_stop_blinking_after 10
cursor_trail              3

# Scrollback
scrollback_lines 10000
wheel_scroll_multiplier 3.0

# Mouse / URLs
url_style        curly
detect_urls      yes
copy_on_select   no
mouse_hide_wait  2.0

# Tabs
tab_bar_edge         bottom
tab_bar_style        powerline
tab_powerline_style  slanted
tab_title_template   " {index}: {title} "
active_tab_font_style   bold
inactive_tab_font_style normal

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Remote control over a per-window socket so wal-sync can live-reload colors
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}
