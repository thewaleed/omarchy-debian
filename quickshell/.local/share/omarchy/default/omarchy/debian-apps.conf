# Debian sources for the Install/Remove menus (read by omarchy-debian-app and
# by ~/dotfils/tools/generate-debian-menu.py).
#
# id|label|method|packages|source
#   id        menu path below install./remove. (new ids append to that submenu)
#   method    apt      packages from the configured APT sources
#             deb      vendor .deb from <source>; its postinst adds the vendor repo
#             repo     vendor APT repo <source> (defined in omarchy-debian-app)
#             flatpak  Flathub application id (per-user install)
#             custom   install_<id>/remove_<id> functions in omarchy-debian-app
#   packages  the first entry is the presence check used by the menu
#
# Anything in the upstream menu without a line here is hidden on Debian.

